<!DOCTYPE html>
<html>
<head>
    <title>BFS Grid Animation</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2 style="text-align:center;">BFS Grid Visualization</h2>

<div id="grid"></div>

<div class="details">
    <h3>Step: <span id="step"></span></h3>
    <h3>Current Node: <span id="current"></span></h3>
    <h3>Frontier: <span id="queue"></span></h3>
    <h3>Explored: <span id="explored"></span></h3>
    <h3>Final Path: <span id="path"></span></h3>
</div>

<div style="text-align:center;">
    <button onclick="runBFS()">Run BFS</button>
</div>

<script>

// 🔁 Map graph nodes → 3x2 grid positions
const nodeMap = {
    'A': [0,0],
    'B': [0,1],
    'C': [1,0],
    'D': [1,1],
    'E': [2,0],
    'F': [2,1]
};

const ROWS = 3;
const COLS = 2;

// Create grid
function createGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let cell = document.createElement("div");
            cell.id = `${r}-${c}`;
            cell.className = "cell";
            grid.appendChild(cell);
        }
    }
}

// Color cell
function colorCell(r, c, cls) {
    document.getElementById(`${r}-${c}`).className = "cell " + cls;
}

// Place robot
function placeRobot(r, c) {
    document.getElementById(`${r}-${c}`).innerHTML = "🤖";
}

// Run BFS
function runBFS() {
    fetch('/run_bfs')
    .then(res => res.json())
    .then(data => animate(data.steps, data.path));
}

// Animate steps
function animate(steps, path) {
    let i = 0;

    let interval = setInterval(() => {

        if (i >= steps.length) {
            clearInterval(interval);

            // show final path text
            document.getElementById("path").innerText =
                path.join(" → ");

            highlightPath(path);
            moveRobot(path);
            return;
        }

        createGrid();

        let step = steps[i];

        // explored
        step.explored.forEach(node => {
            let [r,c] = nodeMap[node];
            colorCell(r,c,"explored");
        });

        // frontier
        step.queue.forEach(node => {
            let [r,c] = nodeMap[node];
            colorCell(r,c,"frontier");
        });

        // current
        let [r,c] = nodeMap[step.current];
        colorCell(r,c,"current");
        placeRobot(r,c);

        // details (same as your original)
        document.getElementById("step").innerText = i + 1;
        document.getElementById("current").innerText = step.current;
        document.getElementById("queue").innerText = step.queue;
        document.getElementById("explored").innerText = step.explored;

        i++;

    }, 1000);
}

// Highlight path
function highlightPath(path) {
    path.forEach(node => {
        let [r,c] = nodeMap[node];
        colorCell(r,c,"path");
    });
}

// Robot follows final path
function moveRobot(path) {
    let i = 0;
    let interval = setInterval(() => {
        if (i >= path.length) {
            clearInterval(interval);
            return;
        }

        createGrid();

        path.forEach(node => {
            let [r,c] = nodeMap[node];
            colorCell(r,c,"path");
        });

        let [r,c] = nodeMap[path[i]];
        placeRobot(r,c);

        i++;
    }, 700);
}

createGrid();

</script>

</body>
</html>
