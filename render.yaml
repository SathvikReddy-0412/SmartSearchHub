databases:
  - name: smartsearchhub-db
    databaseName: smartsearchhub
    plan: free

services:
  # 1. Spring Boot Backend Service (using Dockerfile)
  - type: web
    name: smartsearchhub-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: smartsearchhub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartsearchhub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smartsearchhub-db
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: smartsearchhub-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: smartsearchhub-db
          property: password

  # 2. Node.js Analytics Backend Service
  - type: web
    name: smartsearchhub-nodejs
    runtime: node
    rootDir: Nodejs
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        value: mongodb+srv://Admin:SearchHub123@cluster0.svg74nb.mongodb.net/searchhub_analytics?retryWrites=true&w=majority&appName=Cluster0

  # 3. FastAPI Gateway Service
  - type: web
    name: smartsearchhub-gateway
    runtime: python
    rootDir: gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: SPRING_BOOT_URL
        value: https://smartsearchhub-backend.onrender.com
      - key: SPRING_BACKEND_URL
        value: https://smartsearchhub-backend.onrender.com
      - key: NODE_JS_URL
        value: https://smartsearchhub-nodejs.onrender.com

  # 4. React Frontend Static Site
  - type: static
    name: smartsearchhub-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smartsearchhub-gateway.onrender.com/api
